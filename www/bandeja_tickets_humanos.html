<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>ProTech Security — Tickets Humanos (Derivaciones)</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#020617">
  
  <!-- Tipografía Moderna y Técnica -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="theme-protech.css">

  <style>
    :root {
      --tech-mono: 'JetBrains Mono', monospace;
      --tech-sans: 'Plus Jakarta Sans', sans-serif;
    }
    body {
      font-family: var(--tech-sans);
      background: #020617;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease-out;
      -webkit-tap-highlight-color: transparent;
    }
    body.session-checked {
      visibility: visible;
      opacity: 1;
    }

    .bg-video-container {
      position: fixed;
      inset: 0;
      z-index: -3;
      pointer-events: none;
      overflow: hidden;
      background: #020617;
    }
    .bg-video-container video {
      position: absolute;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      transform: translate(-50%, -50%);
      object-fit: cover;
    }
    .bg-video-overlay {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.14), transparent 60%),
        linear-gradient(rgba(2, 6, 23, 0.65), rgba(2, 6, 23, 0.8));
    }
    .tech-grid-overlay {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px);
      background-size: 24px 24px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,0.8), rgba(0,0,0,0.2));
      -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0.8), rgba(0,0,0,0.2));
    }

    .app-window { height: 100dvh; width: 100vw; }

    #sidebar_menu {
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @media (min-width: 768px) {
      #sidebar_menu.collapsed { margin-left: -18rem; }
    }

    .glass-card {
      background: linear-gradient(145deg, rgba(15, 23, 42, 0.92) 0%, rgba(30, 41, 59, 0.82) 100%) !important;
      border: 1px solid rgba(255, 255, 255, 0.16) !important;
      box-shadow: 
        inset 0 1px 0 0 rgba(255, 255, 255, 0.22),
        0 12px 28px -6px rgba(0, 0, 0, 0.55) !important;
      border-radius: 1.25rem;
      transition: border-color 0.22s ease, transform 0.18s ease;
      position: relative;
      color: #ffffff;
    }
    .glass-card:hover { border-color: rgba(59, 130, 246, 0.48) !important; }

    .btn-glass-action {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.92) 0%, rgba(51, 65, 85, 0.88) 100%) !important;
      border: 1px solid rgba(255, 255, 255, 0.22) !important;
      border-radius: 0.875rem;
      transition: all 0.18s ease;
      color: #ffffff;
    }
    .btn-glass-action:hover:not(:disabled) {
      background: linear-gradient(135deg, rgba(51, 65, 85, 0.98) 0%, rgba(71, 85, 105, 0.92) 100%) !important;
      border-color: rgba(59, 130, 246, 0.65) !important;
    }

    .btn-cyber-primary {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%) !important;
      border: 1px solid rgba(147, 197, 253, 0.4) !important;
      border-radius: 0.875rem;
      color: #ffffff !important;
      transition: all 0.18s ease;
    }
    .btn-cyber-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%) !important;
    }

    .glass-input {
      background: rgba(15, 23, 42, 0.9) !important;
      border: 1px solid rgba(255, 255, 255, 0.18) !important;
      color: #ffffff !important;
    }
    .glass-input:focus {
      background: rgba(30, 41, 59, 0.98) !important;
      border-color: rgba(59, 130, 246, 0.85) !important;
      outline: none;
    }

    .font-tech-mono { font-family: var(--tech-mono); }
    .font-tech-head { font-family: var(--tech-sans); }
    .hide-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .hide-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .hide-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.25); border-radius: 10px; }

    .menu-link {
      display: flex; align-items: center; gap: 0.75rem; padding: 0.55rem 0.75rem; border-radius: 0.75rem; font-size: 0.75rem; font-weight: 600; color: rgba(255, 255, 255, 0.85); transition: all 0.2s; margin-bottom: 0.3rem;
    }
    .menu-link:hover { background: rgba(255, 255, 255, 0.12); color: #ffffff; }
    .menu-link.active { 
      background: linear-gradient(90deg, rgba(37, 99, 235, 0.45) 0%, rgba(37, 99, 235, 0.2) 100%); 
      color: #ffffff; 
      border: 1px solid rgba(59, 130, 246, 0.65);
    }
    .filtro-btn.active {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%) !important; 
      color: white !important;
      border-color: rgba(147, 197, 253, 0.6) !important;
    }
  </style>
</head>
<body class="flex items-center justify-center overflow-hidden text-white">

  <!-- PANTALLA DE CARGA -->
  <div id="page_transition_overlay" class="fixed inset-0 z-[9999] bg-slate-950 flex flex-col items-center justify-center opacity-100 transition-opacity duration-400">
    <div class="glass-card p-8 flex flex-col items-center gap-5 min-w-[270px]">
      <div class="text-center">
        <p class="font-tech-head font-extrabold text-base text-white tracking-wide">ProTech Cyber-OS</p>
        <p class="font-tech-mono text-xs uppercase tracking-widest text-blue-400 font-bold mt-1.5">Cargando Tickets Humanos...</p>
      </div>
    </div>
  </div>

  <!-- VIDEO DE FONDO -->
  <div class="bg-video-container">
    <video autoplay muted loop playsinline preload="auto">
      <source src="fondo-tech.mp4" type="video/mp4">
    </video>
  </div>
  <div class="bg-video-overlay"></div>
  <div class="tech-grid-overlay"></div>

  <div class="app-window flex w-full relative z-10 overflow-hidden">
    <div id="mobile_menu_overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-950/80 z-40 hidden md:hidden"></div>

    <!-- BARRA LATERAL -->
    <aside id="sidebar_menu" class="fixed md:relative top-0 left-0 z-50 h-full w-72 flex-col justify-between border-r border-white/15 p-4 sm:p-5 flex bg-slate-950/95 md:bg-slate-950/55 -translate-x-full md:translate-x-0 flex-shrink-0">
      <div class="space-y-4 overflow-y-auto max-h-[calc(100vh-115px)] pr-1 hide-scrollbar">
        <div class="flex items-center justify-between pb-3.5 border-b border-white/15">
          <div class="flex items-center gap-3">
            <div>
              <h1 class="font-tech-head font-extrabold text-[15px] text-white leading-tight">ProTech</h1>
              <p class="font-tech-mono text-[9px] uppercase tracking-wider text-blue-400 font-bold mt-0.5">Tickets de Asesores</p>
            </div>
          </div>
          <button onclick="toggleSidebar()" class="md:hidden text-white/70 hover:text-rose-400 p-1.5 bg-white/10 rounded-lg">
            <i class="fa-solid fa-xmark text-base"></i>
          </button>
        </div>

        <nav class="space-y-3 font-semibold text-xs">
          <div>
            <button onclick="window.location.href='agenda_tickets.html'" class="glass-card flex w-full items-center gap-3.5 px-3.5 py-2.5 text-white transition">
              <i class="fa-solid fa-calendar-check w-4 text-center text-sm text-blue-400"></i>
              <span class="font-bold text-[11px] uppercase tracking-wider">Agenda de Visitas</span>
            </button>
          </div>
          <div>
            <button class="menu-link active w-full text-left">
              <div class="icon-box h-6 w-6 rounded-md bg-blue-600 text-white flex items-center justify-center text-[10px]"><i class="fa-solid fa-headset"></i></div>
              <span>Tickets Humanos (Bot)</span>
            </button>
          </div>
        </nav>
      </div>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="flex-1 flex flex-col h-full overflow-hidden relative">
      <header class="border-b border-white/15 px-3 sm:px-6 py-3 flex items-center justify-between gap-2 bg-slate-950/90 z-20 flex-shrink-0">
        <div class="flex items-center gap-2.5 flex-1 min-w-0">
          <button onclick="toggleSidebar()" class="text-white p-2 rounded-xl bg-white/10 border border-white/20 md:hidden">
            <i class="fa-solid fa-bars text-xs text-blue-400"></i>
          </button>
          <div class="relative flex-1 max-w-sm">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-white/50 text-xs"></i>
            <input type="text" id="input_buscador" oninput="renderizarTickets()" placeholder="Buscar cliente, teléfono o motivo..." class="glass-input w-full text-xs pl-8 pr-3 py-2 rounded-xl">
          </div>
        </div>
        <button onclick="cargarTicketsHumanos()" class="px-3 py-2 rounded-xl btn-glass-action text-white text-[11px] font-bold flex items-center gap-1.5">
          <i class="fa-solid fa-arrows-rotate text-blue-400"></i> Sincronizar
        </button>
      </header>

      <main class="flex-1 p-3.5 sm:p-6 md:p-8 overflow-y-auto hide-scrollbar relative z-10 pb-24">
        <div class="max-w-5xl mx-auto space-y-6">
          <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
            <div>
              <div class="inline-flex items-center gap-2 text-[10px] font-tech-mono uppercase tracking-widest text-amber-400 font-bold mb-1">
                <i class="fa-solid fa-robot animate-pulse"></i> ATENCIÓN AL CLIENTE • DERIVACIONES DE WHATSAPP
              </div>
              <h2 class="font-tech-head font-extrabold text-xl sm:text-2xl text-white tracking-tight">
                Bandeja de Tickets Humanos
              </h2>
            </div>

            <!-- FILTROS -->
            <div class="flex items-center gap-1.5 overflow-x-auto pb-1 hide-scrollbar">
              <button onclick="cambiarFiltro('todos', this)" class="filtro-btn active btn-glass-action px-3 py-1.5 rounded-xl text-[10px] font-tech-mono font-bold text-white whitespace-nowrap">Todos</button>
              <button onclick="cambiarFiltro('pendiente', this)" class="filtro-btn btn-glass-action px-3 py-1.5 rounded-xl text-[10px] font-tech-mono font-bold text-white/80 whitespace-nowrap">Pendientes</button>
              <button onclick="cambiarFiltro('en_proceso', this)" class="filtro-btn btn-glass-action px-3 py-1.5 rounded-xl text-[10px] font-tech-mono font-bold text-white/80 whitespace-nowrap">En Proceso</button>
              <button onclick="cambiarFiltro('resuelto', this)" class="filtro-btn btn-glass-action px-3 py-1.5 rounded-xl text-[10px] font-tech-mono font-bold text-white/80 whitespace-nowrap">Resueltos</button>
            </div>
          </div>

          <!-- CONTENEDOR DE TICKETS -->
          <div id="contenedor_tickets_humanos" class="space-y-4">
            <div class="text-center py-12 text-white/60 font-medium glass-card">
              <i class="fa-solid fa-spinner fa-spin text-2xl mb-3 block text-blue-400"></i> Cargando tickets humanos desde Supabase...
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="toast_container" class="fixed top-4 right-4 z-[9999] flex flex-col gap-2 max-w-xs w-full pointer-events-none"></div>

  <script>
    const SUPABASE_URL = "https://mmnwyeuhtsyfhazlireo.supabase.co";
    const SUPABASE_KEY = "sb_publishable_eUr5Hftuf8K2_q5tFA23gw_fofx2XH2";
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    let ticketsHumanosGlobales = [];
    let filtroActual = 'todos';

    window.addEventListener('DOMContentLoaded', async () => {
      await cargarTicketsHumanos();
      document.body.classList.add('session-checked');
      setTimeout(() => {
        const overlay = document.getElementById('page_transition_overlay');
        if (overlay) {
          overlay.classList.remove('opacity-100');
          overlay.classList.add('opacity-0');
          setTimeout(() => overlay.classList.add('hidden'), 350);
        }
      }, 200);
    });

    function mostrarToast(mensaje, tipo = 'success') {
      const container = document.getElementById('toast_container');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl border shadow-2xl text-xs font-semibold text-white bg-slate-900/95 border-blue-400/50`;
      toast.innerHTML = `<i class="fa-solid fa-circle-check text-blue-400 text-sm"></i> <span>${mensaje}</span>`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar_menu');
      const overlay = document.getElementById('mobile_menu_overlay');
      if (window.innerWidth >= 768) {
        sidebar.classList.toggle('collapsed');
      } else {
        sidebar.classList.toggle('-translate-x-full');
        overlay.classList.toggle('hidden');
      }
    }

    async function cargarTicketsHumanos() {
      try {
        if (!supabaseClient) return;
        const { data, error } = await supabaseClient
          .from('tickets_humanos')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;
        ticketsHumanosGlobales = data || [];
        renderizarTickets();
      } catch (err) {
        console.error("Error al cargar tickets humanos:", err);
        document.getElementById('contenedor_tickets_humanos').innerHTML = `
          <div class="text-center py-10 text-rose-400 font-medium glass-card">
            <i class="fa-solid fa-triangle-exclamation mb-2 block text-2xl"></i> Error al conectar con la tabla tickets_humanos.
          </div>`;
      }
    }

    async function cambiarEstadoTicket(id, nuevoEstado) {
      try {
        const { error } = await supabaseClient
          .from('tickets_humanos')
          .update({ estado: nuevoEstado })
          .eq('id', id);

        if (error) throw error;
        mostrarToast(`Ticket actualizado a: ${nuevoEstado.toUpperCase()}`, "success");
        await cargarTicketsHumanos();
      } catch (err) {
        console.error("Error actualizando estado:", err);
        mostrarToast("No se pudo actualizar el estado", "error");
      }
    }

    function cambiarFiltro(tipo, btn) {
      filtroActual = tipo;
      document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      renderizarTickets();
    }

    function renderizarTickets() {
      const container = document.getElementById('contenedor_tickets_humanos');
      const query = (document.getElementById('input_buscador')?.value || '').toLowerCase().trim();

      const filtrados = ticketsHumanosGlobales.filter(tk => {
        const matchQ = !query ||
          (tk.cliente || '').toLowerCase().includes(query) ||
          (tk.telefono || '').toLowerCase().includes(query) ||
          (tk.motivo || '').toLowerCase().includes(query);
        if (!matchQ) return false;

        if (filtroActual !== 'todos') {
          return (tk.estado || 'pendiente').toLowerCase() === filtroActual;
        }
        return true;
      });

      if (filtrados.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 text-white/60 font-medium glass-card border-dashed">
            <i class="fa-regular fa-folder-open text-3xl mb-3 block text-blue-400"></i>
            No se encontraron tickets humanos bajo este filtro.
          </div>`;
        return;
      }

      container.innerHTML = '';
      filtrados.forEach(tk => {
        const fechaFormateada = new Date(tk.created_at).toLocaleString('es-EC', { dateStyle: 'medium', timeStyle: 'short' });
        const telLimpio = tk.telefono ? tk.telefono.replace(/\D/g, '') : '';
        const waNum = telLimpio.startsWith('0') ? '593' + telLimpio.substring(1) : telLimpio;

        const estadoColor = tk.estado === 'resuelto' ? 'bg-emerald-500/20 text-emerald-300 border-emerald-400/30' :
                            tk.estado === 'en_proceso' ? 'bg-amber-500/20 text-amber-300 border-amber-400/30' :
                            'bg-rose-500/20 text-rose-300 border-rose-400/30';

        container.innerHTML += `
          <div class="glass-card p-4 sm:p-5 rounded-2xl relative border-l-4 ${tk.estado === 'resuelto' ? 'border-l-emerald-400' : (tk.estado === 'en_proceso' ? 'border-l-amber-400' : 'border-l-rose-500')}">
            <div class="flex flex-col md:flex-row md:items-start justify-between gap-4">
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 mb-2 flex-wrap">
                  <span class="font-tech-mono text-[10px] font-black uppercase bg-white/10 text-blue-300 px-2 py-0.5 rounded border border-white/20">
                    <i class="fa-regular fa-clock mr-1"></i>${fechaFormateada}
                  </span>
                  <span class="font-tech-mono text-[10px] font-bold uppercase px-2.5 py-0.5 rounded border ${estadoColor}">
                    ${(tk.estado || 'pendiente').toUpperCase()}
                  </span>
                </div>

                <h3 class="font-tech-head font-extrabold text-base sm:text-lg text-white leading-snug">${tk.cliente || 'Cliente'}</h3>
                <p class="text-xs text-blue-300 font-mono mt-0.5"><i class="fa-solid fa-phone mr-1"></i>${tk.telefono || 'Sin teléfono'}</p>
                <p class="text-xs text-white/85 mt-2.5 font-medium leading-relaxed bg-white/5 p-3 rounded-xl border border-white/10">
                  <strong>Motivo de derivación:</strong> ${tk.motivo || 'Sin especificar'}
                </p>
              </div>

              <!-- BOTONES DE ACCIÓN RÁPIDA -->
              <div class="flex flex-col gap-2 w-full md:w-56 pt-3 md:pt-0 border-t border-white/15 md:border-0 flex-shrink-0">
                <div class="grid grid-cols-2 gap-1.5">
                  <a href="${waNum ? 'tel:+'+waNum : '#'}" class="flex items-center justify-center gap-1 text-[10px] font-bold text-emerald-300 btn-glass-action px-2 py-2">
                    <i class="fa-solid fa-phone-volume"></i> Llamar
                  </a>
                  <a href="${waNum ? `https://wa.me/${waNum}` : '#'}" target="_blank" class="flex items-center justify-center gap-1 text-[10px] font-bold text-white btn-glass-action px-2 py-2">
                    <i class="fa-brands fa-whatsapp text-emerald-400"></i> WhatsApp
                  </a>
                </div>

                <div class="flex gap-1.5 pt-1">
                  <button onclick="cambiarEstadoTicket('${tk.id}', 'en_proceso')" class="flex-1 text-[10px] font-bold text-amber-200 bg-amber-500/20 hover:bg-amber-500/35 border border-amber-400/30 py-2 rounded-xl transition">
                    En Proceso
                  </button>
                  <button onclick="cambiarEstadoTicket('${tk.id}', 'resuelto')" class="flex-1 text-[10px] font-bold text-emerald-200 bg-emerald-500/20 hover:bg-emerald-500/35 border border-emerald-400/30 py-2 rounded-xl transition">
                    Resolver
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
      });
    }
  </script>
</body>
</html>
